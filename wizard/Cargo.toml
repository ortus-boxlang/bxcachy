[package]
name = "bxcachy-wizard"
version = "0.1.0"
edition = "2021"
description = "The BxCachy setup wizard: a full-screen terminal form. It renders pages given as JSON and writes the answers as JSON; it runs nothing itself."
license = "MIT"

[[bin]]
name = "bxcachy-wizard"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
