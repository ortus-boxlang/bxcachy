name: BxCachy package adapter tests
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n scripts/package-manager.sh tests/package-manager-test.sh
      - name: Mocked pacman contract tests
        run: bash tests/package-manager-test.sh
