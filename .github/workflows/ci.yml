name: BxCachy CI
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bxcachy-ci-global
  cancel-in-progress: true
jobs:
  validate:
    name: 1 - Validate source and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax and CLI contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n bootstrap/install.sh scripts/package-manager.sh tests/package-manager-test.sh tests/bootstrap-test.sh tests/native-smoke.sh tests/native-package-integration.sh scripts/config.sh tests/config-test.sh tests/config-native-test.sh
          test -s src/bxcachy.bxs
          jq -e . box.json >/dev/null   # the manifest must be valid JSON
          for command in version doctor prerequisites desktop-list tui-list web-list optional-list optional-plan profile-list profile-plan plan apps-doctor dev-plan help; do
            grep -Fq "\"$command\"" src/bxcachy.bxs
          done
  package-tests:
    name: 2 - Mocked package-manager tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/package-manager-test.sh
      - run: bash tests/bootstrap-test.sh
      - run: bash tests/config-test.sh
  arch:
    name: 3 - Arch Linux prerequisites
    needs: package-tests
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install and verify toolchains
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed jdk21-openjdk git curl unzip rustup bash
          java -version
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
          rustc --version
      - uses: actions/checkout@v4
      - run: bash -n bootstrap/install.sh
  native:
    name: 4 - MatchBox compile and native tests
    needs: arch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install MVM
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/ortus-boxlang/matchbox-quick-installer/main/install/install.sh -o /tmp/install-mvm.sh
          bash /tmp/install-mvm.sh
          echo "$HOME/.mvm/bin" >> "$GITHUB_PATH"
      - name: Install MatchBox and compile
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.mvm/bin:$PATH"
          MB="$(jq -r .toolchain.matchbox.version box.json)"   # the pin lives in box.json
          # GitHub's anonymous API limit on shared runner addresses answers 403 now and then: retry with backoff.
          for wait in 0 10 30; do sleep "$wait"; mvm install "$MB" && break; [ "$wait" = 30 ] && exit 1; done
          mvm use "$MB"
          matchbox --version
          matchbox --version | grep -F "$MB"
          matchbox --target native src/bxcachy.bxs
      - name: Run smoke tests on compiled executable
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(find . -maxdepth 5 -type f -executable \( -name bxcachy -o -name 'bxcachy.bxs' \) -print -quit)"
          test -n "$candidate" || { echo "::error::No compiled executable found"; exit 1; }
          candidate="$(realpath "$candidate")"
          bash tests/native-smoke.sh "$candidate"
          bash -x tests/native-package-integration.sh "$candidate"
          bash tests/config-native-test.sh "$candidate"
          mkdir -p dist
          cp "$candidate" dist/bxcachy
          chmod +x dist/bxcachy
      - name: Probe file operations under MatchBox (informational)
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$HOME/.mvm/bin:$PATH"
          mkdir -p /tmp/spike && cp tests/spikes/fileops.bxs /tmp/spike/ && cd /tmp/spike
          matchbox --target native fileops.bxs 2>&1 | tail -n 20
          exe="$(find . -maxdepth 3 -type f -executable \( -name fileops -o -name fileops.bxs \) -print -quit)"
          test -n "$exe" || { echo "::warning::probe did not compile with MatchBox"; exit 1; }
          "$exe" 2>&1 | tee /tmp/spike/result.txt
          { echo '### MatchBox file-operation probe'; echo '```'; cat /tmp/spike/result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Probe Native Fusion (Rust BIFs) under MatchBox (informational)
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$HOME/.mvm/bin:$PATH"
          rm -rf /tmp/spike2 /tmp/bxspike-native
          cp -r tests/spikes/native /tmp/spike2 && cd /tmp/spike2
          matchbox --target native app.bxs 2>&1 | tail -n 30
          exe="$(find . -maxdepth 3 -type f -executable \( -name app -o -name app.bxs \) -print -quit)"
          test -n "$exe" || { echo "::warning::Native Fusion probe did not compile"; exit 1; }
          mkdir -p /tmp/bxspike-native && ln -s cfg.txt /tmp/bxspike-native/link.txt
          "$exe" /tmp/bxspike-native 2>&1 | tee /tmp/spike2/result.txt
          { echo '### MatchBox Native Fusion probe'; echo '```'; cat /tmp/spike2/result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ! grep -q '^FAIL' /tmp/spike2/result.txt
      - name: Probe Native Fusion with the latest MatchBox (informational)
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$HOME/.mvm/bin:$PATH"
          pinned="$(jq -r .toolchain.matchbox.version box.json)"
          trap 'mvm use "$pinned" >/dev/null 2>&1 || true' EXIT
          for wait in 0 10 30; do sleep "$wait"; mvm install latest && break; [ "$wait" = 30 ] && exit 1; done
          mvm use latest
          matchbox --version
          rm -rf /tmp/spike3 /tmp/bxspike-native3
          cp -r tests/spikes/native /tmp/spike3 && cd /tmp/spike3
          matchbox --target native app.bxs 2>&1 | tail -n 30
          exe="$(find . -maxdepth 3 -type f -executable \( -name app -o -name app.bxs \) -print -quit)"
          test -n "$exe" || { echo "::warning::Native Fusion did not compile with the latest MatchBox either"; exit 1; }
          mkdir -p /tmp/bxspike-native3 && ln -s cfg.txt /tmp/bxspike-native3/link.txt
          "$exe" /tmp/bxspike-native3 2>&1 | tee /tmp/spike3/result.txt
          { echo '### Native Fusion with the latest MatchBox'; echo '```'; matchbox --version; cat /tmp/spike3/result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ! grep -q '^FAIL' /tmp/spike3/result.txt
      - name: Publish verified native artifact
        uses: actions/upload-artifact@v4
        with:
          name: bxcachy-linux-native
          path: dist/bxcachy
          if-no-files-found: error
  arch-real:
    name: 5 - Real Arch system tests (container, non-root, real pacman)
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run real-system suite
        shell: bash
        run: |
          set -o pipefail
          bash tests/arch/run.sh "$PWD/arch-test-out" 2>&1 | tee arch-run.txt
      - name: Result table
        if: always()
        shell: bash
        run: |
          {
            echo '### Real Arch system tests'
            echo '| Result | Step | Detail |'
            echo '| --- | --- | --- |'
            [[ -f arch-test-out/results.tsv ]] && awk -F'\t' '{printf "| %s | %s | %s %s %s |\n",$1,$2,$3,$4,$5}' arch-test-out/results.tsv
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-real-logs
          path: |
            arch-test-out/
            arch-run.txt
          if-no-files-found: warn
