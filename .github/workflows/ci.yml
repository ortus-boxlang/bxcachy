name: BxCachy native CI
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bootstrap and smoke test
        run: |
          bash -n bootstrap/install.sh
          bash -n tests/native-smoke.sh
          test -s src/bxcachy.bxs
  arch-prerequisites:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Java 21 and build tools
        run: |
          pacman -Syu --noconfirm --needed jdk21-openjdk git curl unzip rustup bash
          java -version
          cargo --version || true
      - uses: actions/checkout@v4
      - name: Validate bootstrap
        run: bash -n bootstrap/install.sh
