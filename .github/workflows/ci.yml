name: BxCachy CI
on:
  push:
    branches: [development]
    tags: ['v*']
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bxcachy-ci-global
  cancel-in-progress: true
jobs:
  validate:
    name: 1 - Validate source and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax and CLI contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n bootstrap/install.sh scripts/package-manager.sh tests/package-manager-test.sh tests/bootstrap-test.sh tests/native-smoke.sh tests/native-package-integration.sh scripts/config.sh tests/config-test.sh tests/config-native-test.sh tests/cli-contract-test.sh tests/catalog-test.sh tests/packages-test.sh tests/setup-test.sh tests/tiling-test.sh tests/keys-test.sh tests/keys-apply-test.sh tests/xremap-test.sh tests/assets-test.sh tests/noctalia-config-test.sh tests/hyprland-setup-test.sh tests/session-test.sh tests/shell-setup-test.sh tests/terminal-setup-test.sh tests/wizard-test.sh tests/init-test.sh tests/toolchain-test.sh tests/runner-test.sh tests/db-test.sh tests/dotfiles-test.sh tests/default-test.sh tests/secrets-test.sh tests/ai-test.sh tests/ai-shell-test.sh tests/ai-session-test.sh tests/ssh-keyboard-test.sh tests/menu-test.sh tests/containers-test.sh tests/utilities-test.sh tests/keys-editor-test.sh tests/web-vpn-test.sh tests/runtime-cloud-test.sh tests/apps-test.sh tests/status-test.sh tests/strata-test.sh tests/extras-test.sh tests/capture-notify-test.sh tests/plasma-panels-test.sh tests/boxlang-test.sh tests/macextras-test.sh tests/update-test.sh tests/skills-test.sh tests/theme-test.sh tests/editor-test.sh tests/vm-test.sh tests/pkg-test.sh tests/system-actions-test.sh tests/appearance-test.sh tests/display-test.sh tests/power-test.sh tests/time-test.sh tests/tweaks-test.sh tests/security-test.sh tests/help-test.sh tests/nas-test.sh tests/refresh-test.sh tests/backup-config-test.sh tests/backup-snapshots-test.sh tests/backup-data-test.sh tests/backup-move-test.sh tests/timeline-test.sh tests/tui-test.sh tests/java-test.sh bootstrap/gen-themes.sh bootstrap/gen-skills.sh bootstrap/gen-docs.sh bootstrap/web-install.sh tests/web-install-test.sh bootstrap/gen-catalog.sh bootstrap/gen-releasekey.sh scripts/gen-signing-key.sh bootstrap/gen-templates.sh bootstrap/gen-assets.sh bootstrap/gen-wizard.sh scripts/get-matchbox.sh scripts/dev-build.sh
          test -s src/Main.bx -a -s src/Application.bx
          jq -e . catalog/apps.json >/dev/null
          bash bootstrap/gen-catalog.sh --check   # src/bxcachy/CatalogData.bx embeds the current catalog
          bash bootstrap/gen-assets.sh --check
          bash bootstrap/gen-templates.sh --check
          bash bootstrap/gen-themes.sh --check
          bash bootstrap/gen-releasekey.sh --check
          bash bootstrap/gen-skills.sh --check
          bash bootstrap/gen-wizard.sh --check
          jq -e . box.json >/dev/null   # the manifest must be valid JSON
          for command in version doctor prerequisites desktop-list tui-list web-list optional-list optional-plan profile-list profile-plan plan apps-doctor dev-plan help; do
            grep -Fq "\"$command\"" src/Main.bx
          done
  package-tests:
    name: 2 - Mocked package-manager tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/package-manager-test.sh
      - run: bash tests/bootstrap-test.sh
      - run: bash tests/web-install-test.sh
      - run: bash tests/config-test.sh
  arch:
    name: 3 - Arch Linux prerequisites
    needs: package-tests
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install and verify toolchains
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed jdk21-openjdk git curl unzip rustup bash
          java -version
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
          rustc --version
      - uses: actions/checkout@v4
      - run: bash -n bootstrap/install.sh
  toolchain:
    name: 3b - MatchBox from the bxcachy branch
    needs: package-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: matchbox-cargo-${{ runner.os }}-${{ hashFiles('box.json') }}
          restore-keys: matchbox-cargo-${{ runner.os }}-
      - name: Get MatchBox (published build, else built from source)
        run: |
          set -euo pipefail
          scripts/get-matchbox.sh matchbox-out/matchbox-linux-x86_64
          cat matchbox-out/matchbox-linux-x86_64.info
      - uses: actions/upload-artifact@v4
        with:
          name: matchbox-linux-x86_64
          path: matchbox-out/matchbox-linux-x86_64
          if-no-files-found: error
  native:
    name: 4 - Compile BxCachy and native tests
    needs: [arch, toolchain]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: matchbox-linux-x86_64
          path: matchbox-out
      - name: Compile with MatchBox
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 755 matchbox-out/matchbox-linux-x86_64 "$HOME/.local/bin/matchbox"
          export PATH="$HOME/.local/bin:$PATH"
          matchbox --version
          matchbox --version | grep -F "$(jq -r .toolchain.matchbox.version box.json)"
          mkdir -p dist
          matchbox --target native --output dist/bxcachy src/Main.bx
      - name: Run smoke tests on compiled executable
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(realpath dist/bxcachy)"
          bash tests/native-smoke.sh "$candidate"
          bash -x tests/native-package-integration.sh "$candidate"
          bash tests/config-native-test.sh "$candidate"
          bash tests/cli-contract-test.sh "$candidate"
          bash tests/catalog-test.sh "$candidate"
          bash tests/packages-test.sh "$candidate"
          bash tests/setup-test.sh "$candidate"
          bash tests/tiling-test.sh "$candidate"
          bash tests/keys-test.sh "$candidate"
          bash tests/keys-apply-test.sh "$candidate"
          bash tests/xremap-test.sh "$candidate"
          bash tests/assets-test.sh "$candidate"
          bash tests/noctalia-config-test.sh "$candidate"
          bash tests/hyprland-setup-test.sh "$candidate"
          bash tests/session-test.sh "$candidate"
          bash tests/shell-setup-test.sh "$candidate"
          bash tests/terminal-setup-test.sh "$candidate"
          (cd src && matchbox ../tests/resolver_test.bxs)
          (cd src && matchbox ../tests/installer_test.bxs)
          (cd src && matchbox ../tests/setup_plan_test.bxs)
          (cd src && matchbox ../tests/shortcuts_test.bxs)
          (cd src && matchbox ../tests/noctalia_config_test.bxs)
          (cd src && matchbox ../tests/catalog_check.bxs)
          (cd src && matchbox ../tests/wizard_app_test.bxs)
          (cd src && matchbox ../tests/wizard_view_test.bxs)
          (cd src && matchbox ../tests/time_machine_test.bxs)
          (cd src && matchbox ../tests/tui_kit_test.bxs)
          (cd src && matchbox ../tests/control_center_test.bxs)
          (cd src && matchbox ../tests/init_plan_test.bxs)
          (cd src && matchbox ../tests/theme_colors_test.bxs)
          (cd src && matchbox ../tests/system_state_test.bxs)
          (cd src && matchbox ../tests/runner_test.bxs)
          (cd src && matchbox ../tests/app_pages_test.bxs)
          bash tests/wizard-test.sh "$candidate"
          bash tests/init-test.sh "$candidate"
          bash tests/toolchain-test.sh "$candidate"
          bash tests/runner-test.sh "$candidate"
          bash tests/db-test.sh "$candidate"
          bash tests/dotfiles-test.sh "$candidate"
          bash tests/default-test.sh "$candidate"
          bash tests/secrets-test.sh "$candidate"
          bash tests/ai-test.sh "$candidate"
          bash tests/ai-shell-test.sh "$candidate"
          bash tests/ai-session-test.sh "$candidate"
          bash tests/ssh-keyboard-test.sh "$candidate"
          bash tests/menu-test.sh "$candidate"
          bash tests/containers-test.sh "$candidate"
          bash tests/utilities-test.sh "$candidate"
          bash tests/keys-editor-test.sh "$candidate"
          bash tests/web-vpn-test.sh "$candidate"
          bash tests/runtime-cloud-test.sh "$candidate"
          bash tests/apps-test.sh "$candidate"
          bash tests/status-test.sh "$candidate"
          bash tests/strata-test.sh "$candidate"
          bash tests/extras-test.sh "$candidate"
          bash tests/capture-notify-test.sh "$candidate"
          bash tests/plasma-panels-test.sh "$candidate"
          bash tests/boxlang-test.sh "$candidate"
          bash tests/macextras-test.sh "$candidate"
          bash tests/update-test.sh "$candidate"
          bash tests/skills-test.sh "$candidate"
          bash tests/theme-test.sh "$candidate"
          bash tests/editor-test.sh "$candidate"
          bash tests/vm-test.sh "$candidate"
          bash tests/pkg-test.sh "$candidate"
          bash tests/system-actions-test.sh "$candidate"
          bash tests/appearance-test.sh "$candidate"
          bash tests/display-test.sh "$candidate"
          bash tests/power-test.sh "$candidate"
          bash tests/time-test.sh "$candidate"
          bash tests/tweaks-test.sh "$candidate"
          bash tests/security-test.sh "$candidate"
          bash tests/help-test.sh "$candidate"
          bash tests/nas-test.sh "$candidate"
          bash tests/refresh-test.sh "$candidate"
          bash tests/backup-config-test.sh "$candidate"
          bash tests/backup-snapshots-test.sh "$candidate"
          bash tests/backup-data-test.sh "$candidate"
          bash tests/backup-move-test.sh "$candidate"
          bash tests/timeline-test.sh "$candidate"
          bash tests/tui-test.sh "$candidate"
          bash tests/java-test.sh "$candidate"
      - name: Publish verified native artifact
        uses: actions/upload-artifact@v4
        with:
          name: bxcachy-linux-native
          path: dist/bxcachy
          if-no-files-found: error
  arch-real:
    name: 5 - Real Arch system tests (container, non-root, real pacman)
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: matchbox-linux-x86_64
          path: matchbox-out
      - name: Run real-system suite
        shell: bash
        run: |
          set -o pipefail
          chmod +x matchbox-out/matchbox-linux-x86_64
          BXCACHY_MATCHBOX_FILE="$PWD/matchbox-out/matchbox-linux-x86_64" bash tests/arch/run.sh "$PWD/arch-test-out" 2>&1 | tee arch-run.txt
      - name: Result table
        if: always()
        shell: bash
        run: |
          {
            echo '### Real Arch system tests'
            echo '| Result | Step | Detail |'
            echo '| --- | --- | --- |'
            [[ -f arch-test-out/results.tsv ]] && awk -F'\t' '{printf "| %s | %s | %s %s %s |\n",$1,$2,$3,$4,$5}' arch-test-out/results.tsv
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-real-logs
          path: |
            arch-test-out/
            arch-run.txt
          if-no-files-found: warn
  publish:
    name: 6 - Publish BxCachy to S3 (beta from development, stable from a v* tag)
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/tags/v'))
    needs: [native, arch-real]
    runs-on: ubuntu-latest
    env:
      HAS_S3: ${{ secrets.AWS_ACCESS_KEY != '' && secrets.AWS_ACCESS_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bxcachy-linux-native
          path: dist
      - name: Lay out the S3 folders (channels stable and beta, snapshots, the one-line installer)
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then CHANNEL=stable; VERSION="${GITHUB_REF_NAME#v}"; else CHANNEL=beta; VERSION="$(jq -r .version box.json)"; fi
          sum="$(sha256sum dist/bxcachy | awk '{print $1}')"
          bash -n bootstrap/web-install.sh
          tar -czf bootstrap.tar.gz bootstrap/install.sh box.json
          bsum="$(sha256sum bootstrap.tar.gz | awk '{print $1}')"
          layout() {
            mkdir -p "$1"
            cp dist/bxcachy "$1/bxcachy-linux-x86_64"; echo "${sum}  bxcachy-linux-x86_64" > "$1/bxcachy-linux-x86_64.sha256"
            cp bootstrap.tar.gz "$1/bootstrap.tar.gz"; echo "${bsum}  bootstrap.tar.gz" > "$1/bootstrap.tar.gz.sha256"
            printf 'version=%s\ncommit=%s\nsha256=%s\nbootstrap_sha256=%s\nchannel=%s\nbuiltAt=%s\n' "$VERSION" "${GITHUB_SHA::7}" "$sum" "$bsum" "$CHANNEL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$1/version-latest.properties"
          }
          layout "build/s3/$CHANNEL"
          if [[ "$CHANNEL" == beta ]]; then layout "build/s3/snapshots/${VERSION}-${GITHUB_SHA::7}"; else layout "build/s3/releases/${VERSION}"; fi
          cp bootstrap/web-install.sh build/s3/install.sh
          echo "channel=$CHANNEL version=$VERSION"
      - name: Sign the release (Ed25519; the key is the secret BXCACHY_SIGNING_KEY, the public key is keys/release.pub)
        env:
          SIGNING_KEY: ${{ secrets.BXCACHY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY:-}" || ! -f keys/release.pub ]]; then
            echo "::warning::BXCACHY_SIGNING_KEY or keys/release.pub is missing: publishing UNSIGNED (clients without a key check SHA-256 only; clients with a key refuse it)"
            exit 0
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/release.key"
          # the public key goes into the published installer, then everything is signed
          sed -i "s|@@PUBKEY_B64@@|$(base64 -w0 keys/release.pub)|" build/s3/install.sh
          for f in $(find build/s3 -name version-latest.properties) build/s3/install.sh; do
            openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/release.key" -in "$f" -out "$f.sig"
            openssl pkeyutl -verify -pubin -inkey keys/release.pub -rawin -in "$f" -sigfile "$f.sig"
          done
          rm -f "$RUNNER_TEMP/release.key"
      - name: Upload to S3 (public-read, never deletes older snapshots or releases)
        if: env.HAS_S3 == 'true'
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read
        env:
          AWS_S3_BUCKET: "downloads.ortussolutions.com"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
          SOURCE_DIR: "build/s3"
          DEST_DIR: "ortussolutions/bxcachy"
