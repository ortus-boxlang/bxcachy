name: BxCachy native build
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install MatchBox version manager
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/ortus-boxlang/matchbox-quick-installer/main/install/install.sh -o /tmp/install-mvm.sh
          bash /tmp/install-mvm.sh
          echo "$HOME/.mvm/bin" >> "$GITHUB_PATH"
      - name: Install MatchBox
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.mvm/bin:$PATH"
          mvm install latest
          mvm use latest
          matchbox --version
      - name: Compile BoxLang CLI to native
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.mvm/bin:$PATH"
          matchbox --target native src/bxcachy.bxs
      - name: Locate compiled executable and run smoke tests
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 5 -type f -executable -print
          candidate="$(find . -maxdepth 5 -type f -executable \( -name bxcachy -o -name 'bxcachy.bxs' \) -print -quit)"
          if [[ -z "$candidate" ]]; then
            echo "::error::MatchBox did not produce a discoverable bxcachy executable"
            exit 1
          fi
          bash tests/native-smoke.sh "$candidate"
      - name: Upload native executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bxcachy-linux-native
          path: |
            src/bxcachy
            bxcachy
          if-no-files-found: error
