evision", "kind": "tui", "category": "Terminal", "target": "television", "source": "aur", "default": false, "description": "Fast fuzzy finder for files, text and commands.", "source_status": "catalog-unverified"}, {"id": "superfile", "name": "Superfile", "kind": "tui", "category": "Files", "target": "superfile", "source": "aur", "default": false, "description": "Modern terminal file manager with a polished UI.", "source_status": "catalog-unverified"}];const selected=new Set(apps.filter(a=>a.default).map(a=>a.id));const q=document.getElementById('q'),kind=document.getElementById('kind'),view=document.getElementById('view'),content=document.getElementById('content');function render(){const term=q.value.toLowerCase();const filtered=apps.filter(a=>(!kind.value||a.kind===kind.value)&&(!term||[a.name,a.category,a.description,a.id].join(' ').toLowerCase().includes(term))&&(!view.value||(view.value==='defaults'?selected.has(a.id):!selected.has(a.id))));document.getElementById('stats').textContent=apps.length+' curated apps · '+selected.size+' selected defaults · '+filtered.length+' shown';content.replaceChildren();const groups={};for(const a of filtered){const group=a.kind.toUpperCase()+' / '+a.category;(groups[group]??=[]).push(a)}for(const [group,entries] of Object.entries(groups).sort()){const section=document.createElement('section');section.className='group';const h=document.createElement('h2');h.textContent=group+' ('+entries.length+')';section.append(h);const cards=document.createElement('div');cards.className='cards';for(const a of entries){const card=document.createElement('div');card.className='card';const check=document.createElement('input');check.type='checkbox';check.checked=selected.has(a.id);check.setAttribute('aria-label','Install '+a.name+' by default');check.onchange=()=>{check.checked?selected.add(a.id):selected.delete(a.id);document.getElementById('stats').textContent=apps.length+' curated apps · '+selected.size+' selected defaults · '+filtered.length+' shown'};const image=document.createElement('div');image.className='image placeholder';image.textContent=a.kind==='web'?'🌐':a.kind==='tui'?'⌨':'◈';if(a.screenshot_url&&/^https:\/\//.test(a.screenshot_url)){const img=document.createElement('img');img.className='image';img.loading='lazy';img.alt=a.name+' preview';img.src=a.screenshot_url;img.onerror=()=>img.replaceWith(image);card.append(check,img)}else card.append(check,image);const body=document.createElement('div');body.className='body';const title=document.createElement('h3');title.textContent=a.name;const desc=document.createElement('p');desc.textContent=a.description;const meta=document.createElement('div');meta.className='meta';meta.textContent='Source: '+a.source+(a.source_status?' · '+a.source_status:'');body.append(title,desc,meta);card.append(body);cards.append(card)}section.append(cards);content.append(section)}}[q,kind,view].forEach(el=>el.addEventListener('input',render));document.getElementById('export').onclick=()=>{const data={schema:1,base:[...selected].sort(),curated:'remaining entries',source:'BxCachy picker'};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='bxcachy-app-profile.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('copy').onclick=()=>navigator.clipboard.writeText([...selected].sort().join(', ')).then(()=>alert('Copied '+selected.size+' IDs')).catch(()=>alert('Clipboard unavailable; use Export JSON'));render();</script></html>
